<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ちいかわ書架</title>
<link rel="stylesheet" href="./styles.css">

<!-- ホーム画面に置いてアプリのように使うための設定（iPhone / Android 共通） -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ちいかわ書架">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171412" media="(prefers-color-scheme: dark)">
</head>
<body>

<header class="bar">
  <button id="btn-toc" class="bar__btn" aria-expanded="false" aria-controls="toc">
    <span aria-hidden="true">☰</span> 目次
  </button>

  <div class="bar__title">
    <span class="bar__name">ちいかわ書架</span>
    <span id="bar-sub" class="bar__sub"></span>
  </div>

  <div class="bar__right">
    <button id="btn-mark" class="bar__btn" title="いまのページにしおりを挟む">しおり</button>
    <button id="btn-update" class="bar__btn bar__btn--accent">
      <span class="spinner" hidden></span><span class="btn-label">更新</span>
    </button>
  </div>
</header>

<main id="stage" class="stage">
  <button class="nav nav--right" id="nav-prev" aria-label="前のページ"><span aria-hidden="true">›</span></button>
  <button class="nav nav--left" id="nav-next" aria-label="次のページ"><span aria-hidden="true">‹</span></button>

  <div class="book" id="book">
    <div class="spread" id="spread"><!-- ページはJSで描画 --></div>
    <div class="book__spine" aria-hidden="true"></div>
  </div>
</main>

<footer class="foot">
  <input id="slider" class="foot__slider" type="range" min="0" max="0" value="0" aria-label="ページ位置">
  <div class="foot__meta"><span id="page-indicator">—</span></div>
</footer>

<!-- 目次 -->
<aside id="toc" class="toc" hidden>
  <div class="toc__head">
    <h2>目次</h2>
    <button id="toc-close" class="toc__close" aria-label="目次を閉じる">✕</button>
  </div>
  <input id="toc-search" class="toc__search" type="search" placeholder="話を探す（日付・タイトル）" autocomplete="off">
  <nav id="toc-list" class="toc__list"></nav>
</aside>
<div id="scrim" class="scrim" hidden></div>

<!-- 更新パネル -->
<dialog id="update-dialog" class="dialog">
  <form method="dialog" class="dialog__head">
    <h2>更新</h2>
    <button class="dialog__close" aria-label="閉じる">✕</button>
  </form>
  <div id="update-body" class="dialog__body"></div>
  <div class="dialog__manual">
    <h3>手動で足す</h3>
    <p class="hint">ポストのURLを貼り付けてください（改行区切りで複数可）。X APIのトークンが無くても使えます。</p>
    <textarea id="manual-input" rows="4" placeholder="https://x.com/.../status/1234567890"></textarea>
    <button id="btn-manual" class="dialog__submit">この分を書架に加える</button>
    <button id="btn-export" class="dialog__submit dialog__submit--ghost" hidden>この端末の追加分を書き出す</button>
  </div>
</dialog>

<div id="toast" class="toast" hidden></div>

<script src="https://platform.twitter.com/widgets.js" charset="utf-8" async></script>
<script src="./app.js" type="module"></script>
<script>
  // オフラインでも開けるようにする。file:// で開いたときは登録しない。
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => { /* 無くても読める */ });
    });
  }
</script>
</body>
</html>
